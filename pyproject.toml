[project]
name = "course-events-aggregator"
version = "0.1.0"
description = "Backend service aggregating Events Provider API data"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "W"]