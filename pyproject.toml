[project]
name = "course-events-aggregator"
version = "0.1.0"
description = "Backend service aggregating Events Provider API data"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["src/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
